<script>
'use strict';
// Project RELIQUARY Message Board (board.html). Everyone can read. Signed-in members post under their display name
// and the administrator as "Administrator" (sign in as administrator on the main page first), or as one of their own
// characters. Members can delete their own posts; the administrator can delete any post. Posts and characters are
// stored online (assets/cloud.js: "board" and "characters").
// Pages (the part of the address after #): forum (home), board-<id>, topic-<id>, characters, character-<id>.
const Cloud=window.ReliquaryCloud||{enabled:false},Accounts=window.ReliquaryAccounts||{open(){},member:null,onChange(){}};
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,5500);}
window.toast=toast;
const isAdmin=()=>!!(Cloud.enabled&&Cloud.isAdmin&&Cloud.isAdmin());
function commandFaction(){try{const c=localStorage.getItem('reliquary-commander');return localStorage.getItem('reliquary-command-alpha')==='1'&&['eisdon','gallia','secara'].includes(c)?c:'';}catch(e){return '';}}
// Forum layout: sections (collapsible) holding boards. flat (on a section or a board): the board has no topics; posts
// go straight into the board as one running thread, newest at the bottom. adminTopics: only the administrator starts
// topics there (on a flat board: only the administrator posts).
// Posts saved before boards existed belong to DEFAULT_BOARD. New boards can be added here; ids use a-z, 0-9 and -.
const FORUM=[
 {id:'ooc',name:'OOC',sub:'Out of character',flat:true,boards:[
  {id:'rules',name:'Rules & Getting Started',desc:'Site rules, account help and how to get started.',adminTopics:true},
  {id:'general',name:'General',desc:'General discussion.'},
  {id:'memes',name:'Memes',desc:'Memes and jokes.'},
  {id:'offtopic',name:'Off-topic',desc:'Anything not related to the setting.'}]}];
const DEFAULT_BOARD='general',BOARDS={};FORUM.forEach(s=>s.boards.forEach(b=>BOARDS[b.id]={flat:!!s.flat,...b,sec:s}));
const CHAR_MAX=Cloud.CHAR_MAX||3;
const CHAR_INFO=[['dob','Date of birth'],['birthplace','Place of birth'],['gender','Gender'],['height','Height'],['weight','Weight'],['nationality','Nationality'],['race','Race'],['occupation','Occupation'],['affiliation','Affiliation']];
const NAME_LABELS=['First name','Middle name','Last name','Other name'];
let member=Accounts.member,boardPosts=[],boardLoaded=false,boardNew=false,boardDraft={title:'',text:'',reply:'',flat:''},boardBusy=false,boardError='',online=[];
let chars={},charsLoaded=false,charEdit=null,collapsed={};
let postAs='';try{postAs=localStorage.getItem('reliquary-post-as')||'';collapsed=JSON.parse(localStorage.getItem('reliquary-forum-collapsed')||'{}')||{};}catch(e){}
function route(){
 const h=decodeURIComponent(location.hash.slice(1)),m=/^(topic|board|character)-(.+)$/.exec(h);
 if(m)return {v:m[1],id:m[2]};
 return {v:h==='characters'?'characters':'forum'};
}
let R=route();
// ---- People and characters ----
function myUid(){return isAdmin()?(Cloud.uid&&Cloud.uid()):member?member.uid:null;}
function baseAuthor(){return isAdmin()?{from:'Administrator',player:'Administrator',faction:''}:member?{from:member.display,player:member.display,faction:commandFaction()}:null;}
function myChars(){const u=myUid();return u?Object.values(chars).filter(c=>c.owner===u).sort((a,b)=>a.id.localeCompare(b.id)):[];}
function boardAuthor(){
 const b=baseAuthor();if(!b)return null;
 const c=postAs&&chars[postAs];return c&&c.owner===myUid()?{...b,from:c.name,char:c.id}:{...b,char:''};
}
const canPost=()=>!!baseAuthor();
const boardTime=t=>t?new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(t)):'';
const mine=p=>isAdmin()||(member&&p.uid&&p.uid===member.uid);
const charHref=c=>'#character-'+encodeURIComponent(c.id);
const initial=s=>escapeHTML((String(s||'?').trim().charAt(0)||'?').toUpperCase());
function charImg(c,cls='char-img'){return c&&c.image?`<span class="${cls}"><img src="${escapeHTML(c.image)}" alt="" loading="lazy"></span>`:`<span class="${cls}">${initial(c&&c.name)}</span>`;}
// ---- Forum data ----
const boardOf=p=>BOARDS[p.board]?p.board:DEFAULT_BOARD;
function topics(boardId){
 const reps={};for(const p of boardPosts)if(p.topic)(reps[p.topic]=reps[p.topic]||[]).push(p);
 return boardPosts.filter(p=>!p.topic&&(!boardId||boardOf(p)===boardId)).map(t=>{const r=reps[t.id]||[];return {t,replies:r.length,last:Math.max(t.at,...r.map(x=>x.at))};}).sort((a,b)=>b.last-a.last);
}
const canStartTopic=b=>canPost()&&!(b&&b.adminTopics&&!isAdmin());
function postName(p){const c=p.char&&chars[p.char];return c?c.name:(p.from||'Unknown');}
function nameHTML(p){
 const c=p.char&&chars[p.char],cls=`board-from${p.faction?' f-'+escapeHTML(p.faction):''}`;
 return c?`<a class="${cls}" href="${charHref(c)}">${escapeHTML(c.name)}</a>`:`<b class="${cls}">${escapeHTML(p.from||'Unknown')}</b>`;
}
function avatarHTML(p){
 const c=p.char&&chars[p.char],inner=c&&c.image?`<img src="${escapeHTML(c.image)}" alt="" loading="lazy">`:initial(postName(p));

// ---- Character quotes ----
// The message box has a Quote button for each of your characters. Click one and everything you type is that
// character's speech (bold, in quotes) until you click it again. Saved in the post as [q=characterId]…[/q]; shown
// bold in quotes, and hovering over (or tapping) the speech shows the speaking character's portrait and name.
// Move the mouse up onto the portrait and click it (or the name) to show the character's bio in the Context Menu. Only the poster's own characters count; a quote from a character that has since been deleted stays bold.
const QUOTE_RE=/\[q=([\w-]{1,40})\]([\s\S]*?)\[\/q\]/g;
function quoteCard(c){return `<span class="rp-card"><a class="rp-card-link" href="${charHref(c)}" title="Show ${escapeHTML(c.name)}'s bio">${charImg(c,'rp-img')}<span class="rp-card-name">${escapeHTML(c.name)}</span></a></span>`;}
function postTextHTML(p){
 const src=String(p.text||'');let out='',i=0,m;QUOTE_RE.lastIndex=0;
 while((m=QUOTE_RE.exec(src))){
  out+=escapeHTML(src.slice(i,m.index));i=QUOTE_RE.lastIndex;
  const own=p.uid&&m[1].startsWith(p.uid+'_'),c=own&&chars[m[1]],said=escapeHTML(m[2].trim().replace(/^["“]([\s\S]*)["”]$/,'$1'));
  out+=!own?escapeHTML(m[2]):c?`<span class="rp" tabindex="0" title="${escapeHTML(c.name)}"><strong>“${said}”</strong>${quoteCard(c)}</span>`:`<strong>“${said}”</strong>`;
 }
 return out+escapeHTML(src.slice(i));
}
// The message box is an editable area so quotes show bold as you type. Its text is kept in boardDraft[field].
function edFromText(t){
 return escapeHTML(t).replace(QUOTE_RE,(m,id,inner)=>`<span class="ed-q" data-char="${id}" title="${escapeHTML(chars[id]?chars[id].name:'')}">${inner}</span>`).replace(/\n/g,'<br>');
}
function edSerialize(ed){
 let out='';
 const walk=(n,inQ)=>{for(const c of n.childNodes){
  if(c.nodeType===3)out+=c.nodeValue.replace(/\u200B/g,'');
  else if(c.nodeName==='BR')out+='\n';
  else if(c.nodeType===1){
   if(c.classList.contains('ed-q')&&!inQ){const start=out.length;out+=`[q=${c.dataset.char}]`;const from=out.length;walk(c,true);if(!out.slice(from).trim())out=out.slice(0,start)+out.slice(from);else out+='[/q]';}
   else{if(/^(DIV|P)$/.test(c.nodeName)&&out&&!out.endsWith('\n'))out+='\n';walk(c,inQ);}
  }}};
 walk(ed,false);return out.replace(/\s+$/,'');
}
function composerHTML(field,label,rows){

 return `<div class="field board-compose"><span>${label}</span>${bar}<div class="board-editor" id="board-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="${label}" data-board-field="${field}" data-key="${escapeHTML(key)}" style="min-height:${rows*1.6+1.4}em">${edFromText(boardDraft[field]||'')}</div></div>`;
}
let edPos=null; // last caret position inside the message box {n: node, o: offset}
function edLive(){const ed=$('board-editor'),s=getSelection();return ed&&s.rangeCount&&ed.contains(s.anchorNode)?(edPos={n:s.anchorNode,o:s.anchorOffset}):null;}
function edQuote(){const ed=$('board-editor');if(!ed||!edPos||!ed.contains(edPos.n))return null;let n=edPos.n;while(n&&n!==ed){if(n.nodeType===1&&n.classList.contains('ed-q'))return n;n=n.parentNode;}return null;}
function edCaret(n,o){const r=document.createRange();r.setStart(n,o);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);edPos={n,o};}
function quoteBtns(){const q=edQuote(),id=q&&q.dataset.char;document.querySelectorAll('[data-quote-char]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.quoteChar===id)));}
function edSync(){const ed=$('board-editor');if(ed)boardDraft[ed.dataset.boardField]=edSerialize(ed);}
function toggleQuote(id){
 const ed=$('board-editor');if(!ed)return;edLive();ed.focus({preventScroll:true});
 if(edPos&&ed.contains(edPos.n))edCaret(edPos.n,Math.min(edPos.o,edPos.n.nodeType===3?edPos.n.length:edPos.n.childNodes.length));else edCaret(ed,ed.childNodes.length);
 const q=edQuote(),sel=getSelection(),r=sel.rangeCount?sel.getRangeAt(0):null;
 if(q){ // stop the current speech: the caret moves just after it
  const after=document.createTextNode('\u200B');q.after(after);edCaret(after,1);
  if(!q.textContent.replace(/\u200B/g,''))q.remove();
  if(q.dataset.char===id){edSync();quoteBtns();return;}
 }
 const span=document.createElement('span');span.className='ed-q';span.dataset.char=id;span.title=chars[id]?chars[id].name:'';
 const rr=getSelection().getRangeAt(0);
 if(!q&&r&&!r.collapsed&&ed.contains(r.commonAncestorContainer)){ // text was selected: make it the character's speech
  span.textContent=r.toString();r.deleteContents();r.insertNode(span);const after=document.createTextNode('\u200B');span.after(after);edCaret(after,1);
 }else{span.textContent='\u200B';rr.insertNode(span);edCaret(span.firstChild,1);}
 edSync();quoteBtns();
}
document.addEventListener('selectionchange',()=>{const ed=$('board-editor'),s=getSelection();if(ed&&s.rangeCount&&ed.contains(s.anchorNode)){edPos={n:s.anchorNode,o:s.anchorOffset};quoteBtns();}});

document.addEventListener('keydown',e=>{

// Uploaded pictures are shrunk in the browser to a small JPEG so they fit in the database.
async function shrinkImage(file){
 if(!file||!/^image\//.test(file.type))throw Error('Choose an image file.');
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(Error('That image could not be read.'));i.src=url;});
  for(const [max,q] of [[400,.85],[320,.8],[256,.72],[200,.62]]){
   const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));
   const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#06121c';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
   const d=cv.toDataURL('image/jpeg',q);if(d.length<=190000)return d;
  }
  throw Error('That image is too large.');
 }finally{URL.revokeObjectURL(url);}
}

// A panel on the right (collapsible, remembered in this browser). It searches the forum and characters, and clicking
// any character (a post's picture or name, a quoted portrait, a character card) shows their bio there; × closes it.

const plainText=t=>String(t||'').replace(QUOTE_RE,'$2');

  const ps=boardPosts.filter(p=>[p.title,plainText(p.text),postName(p),p.player].some(v=>String(v||'').toLowerCase().includes(n))).sort((a,b)=>b.at-a.at);
  h+=`<h3 class="ctx-h">Forum posts (${ps.length})</h3>`+(ps.length?`<ul class="ctx-list">${ps.slice(0,40).map(p=>{const b=BOARDS[boardOf(p)],title=p.title||(p.topic&&titles[p.topic])||b.name;
   return `<li><a class="ctx-hit" href="${postHref(p)}"><span class="ctx-hit-title">${hl(title,q)}</span><span class="ctx-hit-meta">${escapeHTML(b.name)} · ${hl(postName(p),q)} · ${boardTime(p.at)}</span><span class="ctx-hit-text">${hl(snippet(p.text,q),q)}</span></a></li>`;}).join('')}</ul>`:'<p class="ctx-empty">No matches.</p>');
 }
 return h;
}
function ctxBioHTML(){
 const c=chars[ctx.char],x='<button class="ctx-x" type="button" data-ctx-close aria-label="Close the character bio" title="Close">×</button>';
 if(!c)return `<div class="ctx-bio-head"><span>Character</span>${x}</div><p class="ctx-empty">${charsLoaded?'This character no longer exists.':'Loading…'}</p>`;
 const own=c.owner===myUid(),rows=CHAR_INFO.filter(([k])=>c[k]).map(([k,l])=>`<dt>${l}</dt><dd>${escapeHTML(c[k])}</dd>`).join('');
 return `<div class="ctx-bio-head"><span>Character bio</span>${x}</div><article class="ctx-bio">${charImg(c)}<h3>${escapeHTML(c.name)}</h3>${c.player?`<p class="subtext">Played by ${escapeHTML(c.player)}</p>`:''}${rows?`<dl class="char-info">${rows}</dl>`:''}`+
  (c.background?`<h4 class="char-section-title">Background</h4><div class="char-bg">${escapeHTML(c.background)}</div>`:'')+
  (own?`<div class="char-actions"><button class="btn" type="button" data-char-edit="${escapeHTML(c.id)}">Edit</button></div>`:'')+`</article>`;
}
function renderCtx(){
 const el=$('ctx');if(!el)return;el.classList.toggle('collapsed',!ctx.open);$('ctx-open').setAttribute('aria-expanded',String(ctx.open));
 document.querySelectorAll('[data-ctx-scope]').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.ctxScope===ctx.scope)));
 const body=$('ctx-body'),y=body.scrollTop;body.innerHTML=ctx.char?ctxBioHTML():ctxSearchHTML();body.scrollTop=y;
}
document.addEventListener('input',e=>{if(e.target.id==='ctx-q'){ctx.q=e.target.value;ctx.char=null;renderCtx();$('ctx-body').scrollTop=0;}});
document.addEventListener('click',e=>{
 if(e.target.closest('#ctx-open')){ctxOpen(true);return;}
 if(e.target.closest('#ctx-collapse')){ctxOpen(false);return;}
 if(e.target.closest('[data-ctx-close]')){ctx.char=null;renderCtx();return;}
 const sc=e.target.closest('[data-ctx-scope]');if(sc){ctx.scope=sc.dataset.ctxScope;ctx.char=null;ctxSave();renderCtx();return;}
});
// ---- Rendering ----
function bodyHTML(){
 if(!Cloud.enabled)return '<p class="subtext">The message board needs shared online storage, which is not set up for this site.</p>';
 if(R.v==='characters')return charEdit?editorHTML():charactersHTML();
 if(R.v==='character')return profileHTML(R.id);
 if(!boardLoaded)return '<p class="subtext">Loading…</p>';
 if(R.v==='board'){const b=BOARDS[R.id];return b?(b.flat?flatHTML(b):boardHTML(b)):crumbs([['Forum','#forum'],['Not found']])+'<p class="subtext">This board does not exist.</p>';}
 if(R.v==='topic'){const t=boardPosts.find(p=>p.id===R.id&&!p.topic);return t?(BOARDS[boardOf(t)].flat?flatHTML(BOARDS[boardOf(t)]):threadHTML(t)):crumbs([['Forum','#forum'],['Not found']])+'<p class="subtext">This topic no longer exists.</p>';}
 return (boardError?`<p class="board-error" role="alert">${escapeHTML(boardError)}</p>`:'')+homeHTML();
}
function renderOnline(){$('board-online').innerHTML=Cloud.enabled?`<span class="board-live-head">Online now (${online.length})</span> ${online.length?online.map(o=>`<span class="board-chip">${escapeHTML(o.name)}</span>`).join(' '):'<span class="subtext">No one</span>'}`:'';}
function render(){
 const oldEd=$('board-editor'),edFocus=!!oldEd&&oldEd.contains(document.activeElement),edKeep=edLive()||edPos;
 const body=$('board-body'),a=document.activeElement,fid=a&&a.id&&a.id!=='board-editor'&&body.contains(a)?a.id:null,sel=fid&&'selectionStart' in a?[a.selectionStart,a.selectionEnd,a.scrollTop]:null;
 const chv=R.v==='characters'||R.v==='character';
 document.querySelectorAll('[data-tab]').forEach(t=>t.toggleAttribute('aria-current',false));
 const cur=document.querySelector(`[data-tab="${chv?'characters':'forum'}"]`);if(cur)cur.setAttribute('aria-current','page');
 const b=R.v==='board'&&BOARDS[R.id];
 $('board-new-btn').hidden=!(Cloud.enabled&&boardLoaded&&b&&!b.flat&&canStartTopic(b)&&!boardNew);
 body.setAttribute('aria-label',chv?'Characters':'Forum');
 body.innerHTML=bodyHTML();
 {const ne=$('board-editor');if(oldEd&&ne&&ne.dataset.key===oldEd.dataset.key){ne.replaceWith(oldEd);if(edFocus){oldEd.focus({preventScroll:true});if(edKeep&&oldEd.contains(edKeep.n))try{edCaret(edKeep.n,edKeep.o);}catch(e){}}quoteBtns();}}
 if(fid){const n=$(fid);if(n){n.focus({preventScroll:true});if(sel)try{n.setSelectionRange(sel[0],sel[1]);n.scrollTop=sel[2];}catch(e){}}}
}
function onRoute(){R=route();boardNew=false;boardError='';charEdit=null;render();window.scrollTo({top:0});flatScroll();}
function flatScroll(){ // on a flat board, show the newest posts; a link to one post (#topic-id) scrolls to that post
 if(R.v==='topic'){const t=boardPosts.find(p=>p.id===R.id),el=$('post-'+R.id);if(t&&BOARDS[boardOf(t)].flat&&el){el.scrollIntoView({block:'center'});el.classList.add('board-post-hl');}return;}
 if(R.v==='board'&&BOARDS[R.id]&&BOARDS[R.id].flat){const f=$('board-flat-form')||document.querySelector('.board-posts .board-post:last-child');if(f)f.scrollIntoView({block:'end'});}
}
window.addEventListener('hashchange',onRoute);
async function del(ids){try{await Cloud.deleteBoardPosts(ids);}catch(e){toast('Not deleted: '+e.message);}}
function editChar(id){
 const c=id&&chars[id];let d=blankChar();
 if(c){d={...d,...Object.fromEntries(CHAR_INFO.map(([k])=>[k,c[k]])),background:c.background,image:c.image,names:[0,1,2,3].map(i=>c.names[i]||'')};}
 charEdit={id:c?c.id:null,d,busy:false,error:''};
 if(R.v!=='characters'){history.pushState(null,'','#characters');R=route();}
 render();window.scrollTo({top:0});$('cf-name0')?.focus({preventScroll:true});
}
async function deleteChar(id){
 const c=chars[id];if(!c)return;
 if(!confirm(`Delete ${c.name}? This cannot be undone. Posts made as this character stay, under the character's name, without the picture.`))return;
 try{await Cloud.deleteCharacter(id);toast(`${c.name} deleted.`);if(postAs===id)setPostAs('');if(R.v==='character')location.hash='characters';}catch(e){toast('Not deleted: '+e.message);}
}
function setPostAs(v){postAs=v;try{localStorage.setItem('reliquary-post-as',v);}catch(e){}}
document.addEventListener('input',e=>{
 if(e.target.id==='board-editor'){edSync();return;}
 const f=e.target.dataset&&e.target.dataset.boardField;if(f){boardDraft[f]=e.target.value;return;}
 const k=e.target.dataset&&e.target.dataset.charField;if(!k||!charEdit)return;const d=charEdit.d,v=e.target.value;
 if(/^name\d$/.test(k))d.names[+k.slice(4)]=v;
 else if(k==='imageurl'){const u=v.trim();if(u)d.image=u;else if(d.image.startsWith('https://'))d.image='';}
 else d[k]=v;
});
document.addEventListener('change',async e=>{
 if(e.target.id==='board-as'){setPostAs(e.target.value);return;}
 if(e.target.id==='cf-imageurl'&&charEdit){render();return;}
 if(e.target.id==='char-file'&&charEdit){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{charEdit.d.image=await shrinkImage(f);charEdit.error='';}catch(x){charEdit.error=x.message;}
  render();
 }
});
document.addEventListener('click',e=>{
 const cl=e.target.closest('a[href^="#character-"]');if(cl&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&e.button===0){e.preventDefault();ctxShowChar(decodeURIComponent(cl.getAttribute('href').slice(11)));return;} // characters open in the Context Menu
 const qb=e.target.closest('[data-quote-char]');if(qb){toggleQuote(qb.dataset.quoteChar);return;}
 if(e.target.closest('[data-board-signin]')){Accounts.open('signin');return;}
 if(e.target.closest('#board-new-btn')){boardNew=true;boardError='';render();$('board-title-input')?.focus();return;}
 if(e.target.closest('[data-board-cancel]')){boardNew=false;boardError='';render();return;}
 const st=e.target.closest('[data-sec-toggle]');if(st){const id=st.dataset.secToggle;collapsed[id]=!collapsed[id];try{localStorage.setItem('reliquary-forum-collapsed',JSON.stringify(collapsed));}catch(x){}render();return;}
 if(e.target.closest('[data-char-new]')){if(myChars().length<CHAR_MAX)editChar(null);return;}
 const ce=e.target.closest('[data-char-edit]');if(ce){editChar(ce.dataset.charEdit);return;}
 const cd=e.target.closest('[data-char-del]');if(cd){deleteChar(cd.dataset.charDel);return;}
 if(e.target.closest('[data-char-cancel]')){charEdit=null;render();window.scrollTo({top:0});return;}
 if(e.target.closest('[data-char-img-clear]')&&charEdit){charEdit.d.image='';render();return;}
 const d=e.target.closest('[data-board-del]');if(d){
  const p=boardPosts.find(x=>x.id===d.dataset.boardDel);if(!p||!mine(p))return;
  const reps=boardPosts.filter(x=>x.topic===p.id);
  if(BOARDS[boardOf(p)].flat){if(confirm('Delete this post?'))del([p.id]);return;}
  if(p.topic){if(confirm('Delete this reply?'))del([p.id]);}
  else if(!isAdmin()&&reps.some(x=>x.uid!==member.uid))alert('This topic has replies from others, so only an administrator can delete it.');
  else if(confirm(`Delete the topic "${p.title}"${reps.length?' and its replies':''}?`)){location.hash='board-'+boardOf(p);del([p.id,...reps.map(x=>x.id)]);}
 }
});
document.addEventListener('submit',async e=>{
 if(e.target.id==='char-form'){
  e.preventDefault();const ed=charEdit;if(!ed||ed.busy)return;const d=ed.d,u=myUid();ed.error='';
  if(!u){ed.error='Sign in to save characters.';render();return;}
  if(!d.names[0].trim()){ed.error='Enter a first name.';render();$('cf-name0')?.focus();return;}
  if(d.image&&!/^(https:\/\/|data:image\/(jpeg|png|webp);base64,)/.test(d.image)){ed.error='The image link must start with https://';render();return;}
  let id=ed.id;if(!id){for(let i=1;i<=CHAR_MAX&&!id;i++)if(!chars[u+'_'+i])id=u+'_'+i;}
  if(!id){ed.error=`You already have ${CHAR_MAX} characters.`;render();return;}
  ed.busy=true;render();
  try{await Cloud.saveCharacter(id,{...d,player:baseAuthor().player});charEdit=null;toast('Character saved.');location.hash='character-'+encodeURIComponent(id);}
  catch(x){ed.busy=false;ed.error='Not saved: '+x.message;render();}
  return;
 }
 if(e.target.id==='board-flat-form'){
  e.preventDefault();if(boardBusy)return;boardError='';
  const b=R.v==='board'?BOARDS[R.id]:BOARDS[boardOf(boardPosts.find(p=>p.id===R.id)||{})],text=boardDraft.flat.trim(),au=boardAuthor();
  if(!au){boardError='Sign in to post.';render();return;}
  if(!text){boardError='Enter a message.';render();return;}
  if(text.length>2000){boardError='The message is too long (2,000 characters at most).';render();return;}
  boardBusy=true;render();
  try{await Cloud.addBoardPost({topic:'',title:'',text,board:b.id,...au});boardDraft.flat='';edClear();}catch(x){boardError='Not posted: '+x.message;}
  boardBusy=false;render();$('board-flat-form')?.scrollIntoView({block:'end'});return;
 }
 const isNew=e.target.id==='board-new-form',isReply=e.target.id==='board-reply-form';if(!isNew&&!isReply)return;e.preventDefault();
 if(boardBusy)return;boardError='';
 const title=boardDraft.title.trim(),text=(isNew?boardDraft.text:boardDraft.reply).trim(),au=boardAuthor();
 if(!au){boardError='Sign in to post.';render();return;}
 if(isNew&&!title){boardError='Enter a title.';render();return;}
 if(!text){boardError='Enter a message.';render();return;}
 if(text.length>2000){boardError='The message is too long (2,000 characters at most).';render();return;}
 const topic=isReply&&boardPosts.find(p=>p.id===R.id&&!p.topic),board=isNew?R.id:topic?boardOf(topic):DEFAULT_BOARD;
 boardBusy=true;render();
 try{
  const id=await Cloud.addBoardPost({...(isNew?{topic:'',title,text}:{topic:R.id,title:'',text}),board,...au});
  if(isNew){boardDraft.title=boardDraft.text='';edClear();boardNew=false;boardBusy=false;if(id)location.hash='topic-'+encodeURIComponent(id);}else{boardDraft.reply='';edClear();}
 }catch(x){boardError='Not posted: '+x.message;}
 boardBusy=false;render();
});
Accounts.onChange(m=>{member=m;render();});
if(Cloud.enabled){
 Cloud.onAuth&&Cloud.onAuth(()=>render());
 Cloud.watchBoard(posts=>{const first=!boardLoaded;boardPosts=posts;boardLoaded=true;render();renderCtx();if(first)flatScroll();},msg=>{boardLoaded=true;boardError='Message board: '+msg;render();});
 if(Cloud.watchCharacters)Cloud.watchCharacters(c=>{chars=c;charsLoaded=true;renderCtx();if(charEdit&&charEdit.busy)return;render();},msg=>{charsLoaded=true;toast('Characters: '+msg);render();});
 else charsLoaded=true;
 Cloud.watchOnline&&Cloud.watchOnline(o=>{online=o;renderOnline();},()=>{});
}
renderOnline();render();renderCtx();
</script>
</body>
</html>
